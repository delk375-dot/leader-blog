<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Тіньова карта: системи просувають передбачуваних</title>
  <desc id="desc">Мінімалістична editorial-ілюстрація з мережею впливу, переговорним столом, тінями та шаховими системними мотивами.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6f1e8"/>
      <stop offset="0.55" stop-color="#efe4d4"/>
      <stop offset="1" stop-color="#ded0bd"/>
    </linearGradient>
    <radialGradient id="wine" cx="70%" cy="24%" r="62%">
      <stop offset="0" stop-color="#7f1d2d" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#7f1d2d" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7f1d2d" stop-opacity="0"/>
